spring:
  application:
    name: CareConnect_hcl
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/CareConnect}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:amit7280}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

careconnect:
  auth:
    admin-signup-code: ${CARECONNECT_ADMIN_SIGNUP_CODE:}
